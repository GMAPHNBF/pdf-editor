<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HNB Finance - PDF Editor Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --hnb: #004a99; --accent: #00f2ff; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .neon-header {
            background: #050508;
            position: relative;
            overflow: hidden;
            border-bottom: 2px solid var(--hnb);
        }

        .neon-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, var(--accent), #ff007f, var(--accent));
            animation: rotateLight 4s linear infinite;
            z-index: 1;
        }

        .neon-header::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: #0b0c10;
            z-index: 2;
        }

        @keyframes rotateLight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .header-content {
            position: relative;
            z-index: 3;
        }

        .brand-title {
            letter-spacing: 3px;
            text-shadow: 0 0 10px var(--accent), 0 0 20px var(--accent);
        }

        .btn-home-glow {
            background: linear-gradient(135deg, #004a99, #00f2ff);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
            transition: all 0.3s ease;
        }
        .btn-home-glow:hover {
            transform: scale(1.05);
            box-shadow: 0 0 18px rgba(0, 242, 255, 0.8);
            background: linear-gradient(135deg, #00f2ff, #004a99);
        }

        #pdf-wrapper {
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            background: white;
            display: inline-block;
            overflow: hidden;
        }

        #pdf-canvas {
            display: block;
        }

        /* Transparent Interactive Layer */
        .textLayer {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            opacity: 1 !important;
            line-height: 1.0 !important;
            pointer-events: auto !important;
        }

        .textLayer span {
            position: absolute !important;
            cursor: pointer !important;
            color: transparent !important;
            white-space: pre !important;
            transform-origin: 0% 0% !important;
            pointer-events: auto !important;
            border-radius: 2px;
        }

        .textLayer span:hover {
            background-color: rgba(59, 130, 246, 0.35) !important;
            outline: 1px dashed #2563eb;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="neon-header text-white h-20 flex items-center justify-between px-6 shadow-lg z-20">
        <div class="header-content flex items-center gap-3">
            <div class="bg-blue-600 p-2.5 rounded-xl shadow-md border border-cyan-400">
                <i class="fa-solid fa-file-pen text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="brand-title font-black text-xl text-white uppercase tracking-wider">
                    HNB FINANCE <span class="text-cyan-400 font-extrabold">PDF EDITOR</span>
                </h1>
                <p class="text-xs text-slate-300 font-medium tracking-wide">Exact Font Preserved & Perfect Alignment</p>
            </div>
        </div>

        <div class="header-content flex items-center gap-3">
            <a href="https://gmaphnbf.github.io/HNBFGMAP/" class="btn-home-glow text-white px-4 py-2 rounded-xl font-bold text-xs tracking-wider flex items-center gap-2 border border-white/20">
                <i class="fa-solid fa-house text-white text-sm"></i> HOME
            </a>

            <!-- Undo Button -->
            <button onclick="undoLastAction()" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-2 rounded-xl font-bold text-xs tracking-wider transition-all flex items-center gap-1.5 shadow-md border border-amber-400/30">
                <i class="fa-solid fa-rotate-left text-sm"></i> UNDO
            </button>

            <div class="flex items-center gap-2 bg-slate-900/90 px-3 py-2 rounded-xl border border-slate-700">
                <i class="fa-solid fa-print text-cyan-400 text-xs"></i>
                <label for="paper-size" class="text-xs font-bold text-slate-300">Paper Size:</label>
                <select id="paper-size" class="bg-slate-800 text-white text-xs border border-slate-600 rounded-lg px-2 py-1 outline-none cursor-pointer font-semibold">
                    <option value="a4">A4 (Portrait)</option>
                    <option value="letter">Letter</option>
                    <option value="legal">Legal</option>
                    <option value="a3">A3</option>
                </select>
            </div>

            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-bold text-xs tracking-wider transition-all flex items-center gap-2 shadow-md border border-indigo-400/30">
                <i class="fa-solid fa-file-arrow-up text-sm"></i> SELECT PDF
                <input type="file" id="pdf-file" accept="application/pdf" class="hidden">
            </label>

            <button onclick="downloadPDF()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl font-bold text-xs tracking-wider transition-all flex items-center gap-2 shadow-md border border-emerald-400/30">
                <i class="fa-solid fa-file-pdf text-sm"></i> SAVE PDF
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h2 class="font-bold text-slate-700 flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-clock-rotate-left text-blue-600"></i> Edit History
                </h2>
                <span id="history-count" class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-extrabold">0</span>
            </div>
            
            <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div id="empty-state" class="text-center py-10 text-slate-400">
                    <i class="fa-solid fa-i-cursor text-3xl mb-2 text-slate-300"></i>
                    <p class="text-xs font-medium">Click on any text in the PDF to edit without changing font size.</p>
                </div>
            </div>

            <div class="p-4 border-t border-slate-200 bg-slate-950 text-center">
                <p class="text-xs font-bold text-slate-400 tracking-wider">
                    DEVELOPED BY <span class="text-cyan-400 font-extrabold">9299</span>
                </p>
            </div>
        </aside>

        <main id="editor-container" class="flex-1 overflow-auto p-8 flex justify-center items-start bg-slate-200">
            <div id="pdf-wrapper">
                <canvas id="pdf-canvas"></canvas>
                <div id="text-layer" class="textLayer"></div>
            </div>
        </main>
    </div>

    <!-- Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all border border-slate-100">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center border-b border-slate-800">
                <h3 class="font-bold text-sm flex items-center gap-2">
                    <i class="fa-solid fa-font text-cyan-400"></i> Edit Text Content
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Original Text</label>
                    <div id="modal-original-text" class="p-3 bg-slate-100 rounded-xl text-sm text-slate-600 italic break-words border border-slate-200 font-medium"></div>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">New Text</label>
                    <input type="text" id="modal-input" class="w-full border-2 border-slate-300 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:border-blue-600 transition-all">
                </div>
            </div>
            <div class="bg-slate-50 p-4 border-t border-slate-100 flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-200 transition-all">Cancel</button>
                <button id="modal-save-btn" class="px-5 py-2 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-500 text-white transition-all shadow-md">Apply Change</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const fileInput = document.getElementById('pdf-file');
        const canvas = document.getElementById('pdf-canvas');
        const textLayerDiv = document.getElementById('text-layer');
        const pdfWrapper = document.getElementById('pdf-wrapper');
        const ctx = canvas.getContext('2d');
        const modal = document.getElementById('edit-modal');
        const modalInput = document.getElementById('modal-input');
        const modalOriginalText = document.getElementById('modal-original-text');
        
        let currentTargetSpan = null;
        let historyCounter = 0;
        let historyStack = [];
        let baseCanvasSnapshot = null;

        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const page = await pdf.getPage(1);

            const scale = 2.0; 
            const viewport = page.getViewport({ scale: scale });

            canvas.height = viewport.height;
            canvas.width = viewport.width;

            pdfWrapper.style.width = viewport.width + 'px';
            pdfWrapper.style.height = viewport.height + 'px';

            textLayerDiv.style.width = viewport.width + 'px';
            textLayerDiv.style.height = viewport.height + 'px';
            textLayerDiv.innerHTML = '';

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            
            baseCanvasSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const textContent = await page.getTextContent();
            
            await pdfjsLib.renderTextLayer({
                textContent: textContent,
                container: textLayerDiv,
                viewport: viewport,
                textDivs: []
            }).promise;

            historyStack = [];
            historyCounter = 0;
            document.getElementById('history-count').innerText = "0";
            document.getElementById('history-list').innerHTML = `
                <div id="empty-state" class="text-center py-10 text-slate-400">
                    <i class="fa-solid fa-i-cursor text-3xl mb-2 text-slate-300"></i>
                    <p class="text-xs font-medium">Click on any text in the PDF to edit without changing font size.</p>
                </div>`;
        });

        textLayerDiv.addEventListener('click', function(e) {
            if (e.target && e.target.tagName === 'SPAN') {
                currentTargetSpan = e.target;
                modalOriginalText.innerText = currentTargetSpan.innerText;
                modalInput.value = currentTargetSpan.innerText;
                modal.classList.remove('hidden');
                modalInput.focus();
            }
        });

        document.getElementById('modal-save-btn').addEventListener('click', function() {
            if (!currentTargetSpan) return;

            const oldText = modalOriginalText.innerText;
            const newText = modalInput.value;

            if (newText.trim() !== "") {
                applyTextChange(currentTargetSpan, oldText, newText);
            }

            closeModal();
        });

        function applyTextChange(span, oldText, newText) {
            // Span Exact Position
            const spanLeft = span.offsetLeft;
            const spanTop = span.offsetTop;
            const spanWidth = span.offsetWidth || (span.innerText.length * 8);
            const spanHeight = span.offsetHeight || 16;

            // Original Style Capture
            const computedStyle = window.getComputedStyle(span);
            const fontSize = computedStyle.fontSize;
            const fontFamily = computedStyle.fontFamily;
            const color = computedStyle.color && computedStyle.color !== 'rgba(0, 0, 0, 0)' && computedStyle.color !== 'transparent' ? computedStyle.color : '#000000';

            // HTML Element InnerText Update
            span.innerText = newText;

            const editRecord = {
                span: span,
                oldText: oldText,
                newText: newText,
                x: spanLeft,
                y: spanTop,
                width: spanWidth,
                height: spanHeight,
                fontSize: fontSize,
                fontFamily: fontFamily,
                color: color
            };

            historyStack.push(editRecord);

            // Directly redraw text on Canvas
            redrawCanvasWithEdits();
            addToHistory(editRecord);
        }

        function closeModal() {
            modal.classList.add('hidden');
            currentTargetSpan = null;
        }

        function addToHistory(record) {
            const historyList = document.getElementById('history-list');
            const emptyState = document.getElementById('empty-state');
            
            if (emptyState) emptyState.remove();

            historyCounter++;
            document.getElementById('history-count').innerText = historyCounter;

            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const historyItem = document.createElement('div');
            historyItem.className = 'bg-slate-50 border border-slate-200 p-3 rounded-xl text-xs space-y-1 shadow-xs flex justify-between items-center';
            historyItem.innerHTML = `
                <div class="space-y-0.5 max-w-[170px]">
                    <div class="flex justify-between items-center text-slate-400 font-bold">
                        <span>#${historyCounter} Text Edit</span>
                        <span>${timeString}</span>
                    </div>
                    <div class="line-through text-rose-500 truncate font-medium">${record.oldText}</div>
                    <div class="text-emerald-600 font-bold truncate">${record.newText}</div>
                </div>
                <button onclick="undoSpecificAction(${historyStack.length - 1})" class="text-amber-600 hover:bg-amber-100 p-1.5 rounded-lg font-bold transition-all" title="Undo this edit">
                    <i class="fa-solid fa-rotate-left text-sm"></i>
                </button>
            `;

            historyList.prepend(historyItem);
        }

        function undoLastAction() {
            if (historyStack.length === 0) return;
            undoSpecificAction(historyStack.length - 1);
        }

        function undoSpecificAction(index) {
            if (index < 0 || index >= historyStack.length) return;

            const record = historyStack[index];
            record.span.innerText = record.oldText;

            historyStack.splice(index, 1);

            redrawCanvasWithEdits();
            refreshHistoryUI();
        }

        function redrawCanvasWithEdits() {
            if (!baseCanvasSnapshot) return;

            // 1. Original PDF Canvas එක Restore කිරීම
            ctx.putImageData(baseCanvasSnapshot, 0, 0);

            // 2. වෙනස් කළ සියලුම Text Canvas එක මත Direct Render කිරීම
            historyStack.forEach(rec => {
                // Erase old text on Canvas
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(rec.x - 2, rec.y - 2, rec.width + 12, rec.height + 6);

                // Draw new text with exact Font, Size & Color directly on Canvas
                ctx.font = `${rec.fontSize} ${rec.fontFamily}`;
                ctx.fillStyle = rec.color;
                ctx.textBaseline = 'top';
                ctx.fillText(rec.newText, rec.x, rec.y);
            });
        }

        function refreshHistoryUI() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            historyCounter = 0;

            if (historyStack.length === 0) {
                document.getElementById('history-count').innerText = "0";
                historyList.innerHTML = `
                    <div id="empty-state" class="text-center py-10 text-slate-400">
                        <i class="fa-solid fa-i-cursor text-3xl mb-2 text-slate-300"></i>
                        <p class="text-xs font-medium">Click on any text in the PDF to edit without changing font size.</p>
                    </div>`;
                return;
            }

            const currentStack = [...historyStack];
            historyStack = [];

            currentStack.forEach(rec => {
                historyStack.push(rec);
                addToHistory(rec);
            });
        }

        async function downloadPDF() {
            if (!canvas.width) {
                alert("කරුණාකර පළමුව PDF එකක් Upload කරන්න!");
                return;
            }

            const { jsPDF } = window.jspdf;
            const selectedPaperSize = document.getElementById('paper-size').value;
            
            const pdf = new jsPDF({
                orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
                unit: 'px',
                format: selectedPaperSize
            });

            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();

            // Canvas Image එක direct ලෙස PDF එකට Save වීම සිදු වේ
            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            
            pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
            pdf.save('edited_document.pdf');
        }
    </script>
</body>
</html>
