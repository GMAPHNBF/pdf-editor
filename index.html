<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HNB Finance - PDF Editor Mobile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- jsPDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --hnb: #004a99; --accent: #00f2ff; }

        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .neon-header {
            background: #0b0c10;
            border-bottom: 2px solid var(--hnb);
        }

        .brand-title {
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--accent);
        }

        /* Responsive PDF Canvas Wrapper */
        #viewport-container {
            width: 100%;
            height: calc(100vh - 130px);
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-color: #cbd5e1;
            padding: 10px;
        }

        #pdf-wrapper {
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            background: white;
            margin: auto;
        }

        #pdf-canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Transparent Interactive Layer */
        .textLayer {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            opacity: 1 !important;
            line-height: 1.0 !important;
            pointer-events: auto !important;
        }

        .textLayer span {
            position: absolute !important;
            cursor: pointer !important;
            color: transparent !important;
            white-space: pre !important;
            transform-origin: 0% 0% !important;
            pointer-events: auto !important;
            border-radius: 2px;
        }

        .textLayer span:active, .textLayer span:hover {
            background-color: rgba(59, 130, 246, 0.4) !important;
            outline: 1.5px solid #00f2ff;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans h-screen flex flex-col justify-between overflow-hidden">

    <!-- Mobile Top Bar -->
    <header class="neon-header text-white h-14 flex items-center justify-between px-4 shadow-md z-20 shrink-0">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 p-1.5 rounded-lg border border-cyan-400">
                <i class="fa-solid fa-file-pen text-sm text-white"></i>
            </div>
            <div>
                <h1 class="brand-title font-black text-xs text-white uppercase">
                    HNB FINANCE <span class="text-cyan-400">EDITOR</span>
                </h1>
                <p class="text-[9px] text-slate-400 font-medium">Mobile Pro Version</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <a href="https://gmaphnbf.github.io/HNBFGMAP/" class="bg-blue-600/30 border border-cyan-400/50 text-cyan-300 p-2 rounded-lg text-xs font-bold flex items-center justify-center">
                <i class="fa-solid fa-house"></i>
            </a>
            <select id="paper-size" class="bg-slate-800 text-cyan-300 text-[11px] border border-slate-700 rounded-lg px-1.5 py-1 outline-none font-bold">
                <option value="a4">A4</option>
                <option value="letter">Letter</option>
                <option value="legal">Legal</option>
            </select>
        </div>
    </header>

    <!-- Main Mobile Workspace -->
    <main id="viewport-container">
        <div id="pdf-wrapper">
            <canvas id="pdf-canvas"></canvas>
            <div id="text-layer" class="textLayer"></div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation Bar / Controls -->
    <nav class="bg-slate-950 border-t border-slate-800 h-16 flex items-center justify-around px-2 z-20 shrink-0">
        <!-- Open File -->
        <label class="flex flex-col items-center justify-center text-slate-400 active:text-cyan-400 cursor-pointer">
            <i class="fa-solid fa-folder-open text-base mb-0.5"></i>
            <span class="text-[10px] font-bold">Open</span>
            <input type="file" id="pdf-file" accept="application/pdf" class="hidden">
        </label>

        <!-- Undo -->
        <button onclick="undoLastAction()" class="flex flex-col items-center justify-center text-slate-400 active:text-amber-400">
            <i class="fa-solid fa-rotate-left text-base mb-0.5"></i>
            <span class="text-[10px] font-bold">Undo</span>
        </button>

        <!-- Edit History Drawer Button -->
        <button onclick="toggleHistoryDrawer()" class="flex flex-col items-center justify-center text-slate-400 active:text-blue-400 relative">
            <i class="fa-solid fa-clock-rotate-left text-base mb-0.5"></i>
            <span class="text-[10px] font-bold">History</span>
            <span id="history-badge" class="absolute -top-1 -right-2 bg-blue-600 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </button>

        <!-- Save PDF -->
        <button onclick="downloadPDF()" class="flex flex-col items-center justify-center text-emerald-400 active:text-emerald-300">
            <i class="fa-solid fa-file-arrow-down text-lg mb-0.5"></i>
            <span class="text-[10px] font-extrabold">Save PDF</span>
        </button>
    </nav>

    <!-- Mobile Bottom History Drawer -->
    <div id="history-drawer" class="fixed inset-x-0 bottom-0 bg-slate-900 border-t border-slate-700 rounded-t-2xl shadow-2xl z-40 transform translate-y-full transition-transform duration-300 max-h-[60vh] flex flex-col">
        <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-950 rounded-t-2xl">
            <h3 class="text-xs font-bold text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-cyan-400"></i> Edit History
            </h3>
            <button onclick="toggleHistoryDrawer()" class="text-slate-400 p-1"><i class="fa-solid fa-xmark text-base"></i></button>
        </div>
        <div id="history-list" class="p-3 overflow-y-auto space-y-2 flex-1">
            <p id="empty-state" class="text-center text-xs text-slate-500 py-6">No edits made yet. Tap on any text to edit.</p>
        </div>
        <div class="p-2 bg-slate-950 text-center border-t border-slate-800">
            <p class="text-[9px] font-bold text-slate-500">DEVELOPED BY <span class="text-cyan-400">9299</span></p>
        </div>
    </div>

    <!-- Mobile Text Edit Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-black/70 backdrop-blur-xs hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-xs overflow-hidden shadow-2xl">
            <div class="bg-slate-950 p-3 flex justify-between items-center border-b border-slate-800">
                <h3 class="font-bold text-xs text-cyan-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-pen-to-square"></i> Edit Text
                </h3>
                <button onclick="closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="p-4 space-y-3">
                <div>
                    <label class="text-[9px] font-bold text-slate-400 uppercase block mb-1">Original Text</label>
                    <div id="modal-original-text" class="p-2 bg-slate-800 rounded-lg text-xs text-slate-300 italic break-words border border-slate-700 font-medium"></div>
                </div>
                <div>
                    <label class="text-[9px] font-bold text-slate-400 uppercase block mb-1">New Text</label>
                    <input type="text" id="modal-input" class="w-full bg-slate-800 text-white border border-cyan-500/50 rounded-lg p-2.5 text-xs font-semibold focus:outline-none focus:border-cyan-400">
                </div>
            </div>
            <div class="bg-slate-950 p-3 border-t border-slate-800 flex justify-end gap-2">
                <button onclick="closeModal()" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 bg-slate-800">Cancel</button>
                <button id="modal-save-btn" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-cyan-600 text-white shadow-md">Apply</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const fileInput = document.getElementById('pdf-file');
        const canvas = document.getElementById('pdf-canvas');
        const textLayerDiv = document.getElementById('text-layer');
        const pdfWrapper = document.getElementById('pdf-wrapper');
        const ctx = canvas.getContext('2d');
        const modal = document.getElementById('edit-modal');
        const modalInput = document.getElementById('modal-input');
        const modalOriginalText = document.getElementById('modal-original-text');
        
        let currentTargetSpan = null;
        let historyCounter = 0;
        let historyStack = [];
        let baseCanvasSnapshot = null;

        function toggleHistoryDrawer() {
            const drawer = document.getElementById('history-drawer');
            drawer.classList.toggle('translate-y-full');
        }

        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const page = await pdf.getPage(1);

            const scale = 2.0; 
            const viewport = page.getViewport({ scale: scale });

            canvas.height = viewport.height;
            canvas.width = viewport.width;

            pdfWrapper.style.width = viewport.width + 'px';
            pdfWrapper.style.height = viewport.height + 'px';

            textLayerDiv.style.width = viewport.width + 'px';
            textLayerDiv.style.height = viewport.height + 'px';
            textLayerDiv.innerHTML = '';

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            
            baseCanvasSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

            const textContent = await page.getTextContent();
            
            await pdfjsLib.renderTextLayer({
                textContent: textContent,
                container: textLayerDiv,
                viewport: viewport,
                textDivs: []
            }).promise;

            historyStack = [];
            historyCounter = 0;
            document.getElementById('history-badge').innerText = "0";
            document.getElementById('history-list').innerHTML = `<p id="empty-state" class="text-center text-xs text-slate-500 py-6">No edits made yet. Tap on any text to edit.</p>`;
        });

        textLayerDiv.addEventListener('click', function(e) {
            if (e.target && e.target.tagName === 'SPAN') {
                currentTargetSpan = e.target;
                modalOriginalText.innerText = currentTargetSpan.innerText;
                modalInput.value = currentTargetSpan.innerText;
                modal.classList.remove('hidden');
                modalInput.focus();
            }
        });

        document.getElementById('modal-save-btn').addEventListener('click', function() {
            if (!currentTargetSpan) return;

            const oldText = modalOriginalText.innerText;
            const newText = modalInput.value;

            if (newText.trim() !== "") {
                applyTextChange(currentTargetSpan, oldText, newText);
            }

            closeModal();
        });

        function applyTextChange(span, oldText, newText) {
            const spanLeft = span.offsetLeft;
            const spanTop = span.offsetTop;
            const spanWidth = span.offsetWidth || (span.innerText.length * 8);
            const spanHeight = span.offsetHeight || 16;

            const computedStyle = window.getComputedStyle(span);
            const fontSize = computedStyle.fontSize;
            const fontFamily = computedStyle.fontFamily;
            const color = computedStyle.color && computedStyle.color !== 'rgba(0, 0, 0, 0)' && computedStyle.color !== 'transparent' ? computedStyle.color : '#000000';

            span.innerText = newText;

            const editRecord = {
                span: span,
                oldText: oldText,
                newText: newText,
                x: spanLeft,
                y: spanTop,
                width: spanWidth,
                height: spanHeight,
                fontSize: fontSize,
                fontFamily: fontFamily,
                color: color
            };

            historyStack.push(editRecord);

            redrawCanvasWithEdits();
            addToHistory(editRecord);
        }

        function closeModal() {
            modal.classList.add('hidden');
            currentTargetSpan = null;
        }

        function addToHistory(record) {
            const historyList = document.getElementById('history-list');
            const emptyState = document.getElementById('empty-state');
            
            if (emptyState) emptyState.remove();

            historyCounter++;
            document.getElementById('history-badge').innerText = historyCounter;

            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const historyItem = document.createElement('div');
            historyItem.className = 'bg-slate-800 border border-slate-700 p-2 rounded-xl text-xs flex justify-between items-center';
            historyItem.innerHTML = `
                <div class="space-y-0.5 max-w-[200px]">
                    <div class="flex items-center gap-2 text-slate-400 font-bold text-[9px]">
                        <span>#${historyCounter}</span>
                        <span>${timeString}</span>
                    </div>
                    <div class="line-through text-rose-400 truncate text-[11px]">${record.oldText}</div>
                    <div class="text-cyan-400 font-bold truncate text-[11px]">${record.newText}</div>
                </div>
                <button onclick="undoSpecificAction(${historyStack.length - 1})" class="text-amber-400 hover:bg-slate-700 p-1.5 rounded-lg" title="Undo">
                    <i class="fa-solid fa-rotate-left text-xs"></i>
                </button>
            `;

            historyList.prepend(historyItem);
        }

        function undoLastAction() {
            if (historyStack.length === 0) return;
            undoSpecificAction(historyStack.length - 1);
        }

        function undoSpecificAction(index) {
            if (index < 0 || index >= historyStack.length) return;

            const record = historyStack[index];
            record.span.innerText = record.oldText;

            historyStack.splice(index, 1);

            redrawCanvasWithEdits();
            refreshHistoryUI();
        }

        function redrawCanvasWithEdits() {
            if (!baseCanvasSnapshot) return;

            ctx.putImageData(baseCanvasSnapshot, 0, 0);

            historyStack.forEach(rec => {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(rec.x - 2, rec.y - 2, rec.width + 12, rec.height + 6);

                ctx.font = `${rec.fontSize} ${rec.fontFamily}`;
                ctx.fillStyle = rec.color;
                ctx.textBaseline = 'top';
                ctx.fillText(rec.newText, rec.x, rec.y);
            });
        }

        function refreshHistoryUI() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            historyCounter = 0;

            if (historyStack.length === 0) {
                document.getElementById('history-badge').innerText = "0";
                historyList.innerHTML = `<p id="empty-state" class="text-center text-xs text-slate-500 py-6">No edits made yet. Tap on any text to edit.</p>`;
                return;
            }

            const currentStack = [...historyStack];
            historyStack = [];

            currentStack.forEach(rec => {
                historyStack.push(rec);
                addToHistory(rec);
            });
        }

        async function downloadPDF() {
            if (!canvas.width) {
                alert("කරුණාකර පළමුව PDF එකක් Open කරගන්න!");
                return;
            }

            const { jsPDF } = window.jspdf;
            const selectedPaperSize = document.getElementById('paper-size').value;
            
            const pdf = new jsPDF({
                orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
                unit: 'px',
                format: selectedPaperSize
            });

            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();

            const imgData = canvas.toDataURL('image/jpeg', 1.0);
            
            pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
            pdf.save('edited_document.pdf');
        }
    </script>
</body>
</html>
