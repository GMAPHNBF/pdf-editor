<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor Pro - Developed by UMESH</title>
    <!-- Tailwind CSS for UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf_viewer.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- jsPDF Library for Direct PDF Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Canvas & Text Layer Container */
        #pdf-wrapper {
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            background: white;
            display: inline-block;
        }

        .textLayer {
            opacity: 1 !important;
        }

        .textLayer span {
            cursor: pointer;
            color: transparent;
            transition: all 0.15s ease;
            border-radius: 2px;
        }

        .textLayer span:hover {
            background-color: rgba(59, 130, 246, 0.25) !important;
            outline: 1px dashed #3b82f6;
        }

        /* Edited Text Styles */
        .edited-span {
            color: #000000 !important;
            background-color: #ffffff !important;
            opacity: 1 !important;
            display: flex !important;
            align-items: center !important;
            white-space: nowrap !important;
            overflow: hidden !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-slate-900 text-white h-16 flex items-center justify-between px-6 shadow-md z-20">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg">
                <i class="fa-solid fa-file-pen text-xl text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-none">PDF EDITOR <span class="text-indigo-400">PRO</span></h1>
                <p class="text-xs text-slate-400 mt-1">Exact Font Preserved & Perfect Alignment</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- HOME BUTTON -->
            <a href="https://gmaphnbf.github.io/HNBFGMAP/" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition-all flex items-center gap-2 border border-slate-700 shadow-sm">
                <i class="fa-solid fa-house text-indigo-400"></i> HOME
            </a>

            <!-- Paper Size Selection Dropdown -->
            <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                <i class="fa-solid fa-print text-slate-400 text-xs"></i>
                <label for="paper-size" class="text-xs font-semibold text-slate-300">Paper Size:</label>
                <select id="paper-size" class="bg-slate-900 text-white text-xs border border-slate-600 rounded px-2 py-1 outline-none cursor-pointer">
                    <option value="a4">A4 (Portrait)</option>
                    <option value="letter">Letter</option>
                    <option value="legal">Legal</option>
                    <option value="a3">A3</option>
                </select>
            </div>

            <!-- Select PDF Button -->
            <label class="cursor-pointer bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition-all flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-file-arrow-up"></i> Select PDF
                <input type="file" id="pdf-file" accept="application/pdf" class="hidden">
            </label>

            <!-- Save PDF Button -->
            <button onclick="downloadPDF()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition-all flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-file-pdf"></i> Save PDF
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar - History & Credit -->
        <aside class="w-80 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h2 class="font-semibold text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i> Edit History
                </h2>
                <span id="history-count" class="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
            </div>
            
            <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-3">
                <div id="empty-state" class="text-center py-10 text-slate-400">
                    <i class="fa-solid fa-i-cursor text-3xl mb-2"></i>
                    <p class="text-xs">Click on any text in the PDF to edit without changing font size.</p>
                </div>
            </div>

            <!-- Developer Credit -->
            <div class="p-4 border-t border-slate-200 bg-slate-900 text-center">
                <p class="text-xs font-semibold text-slate-400 tracking-wider">
                    DEVELOPED BY <span class="text-indigo-400 font-bold">UMESH</span>
                </p>
            </div>
        </aside>

        <!-- Main PDF Canvas Container -->
        <main id="editor-container" class="flex-1 overflow-auto p-8 flex justify-center items-start bg-slate-200">
            <div id="pdf-wrapper">
                <canvas id="pdf-canvas"></canvas>
                <div id="text-layer" class="textLayer"></div>
            </div>
        </main>
    </div>

    <!-- Edit Modal Overlay -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <h3 class="font-semibold text-sm flex items-center gap-2">
                    <i class="fa-solid fa-font text-indigo-400"></i> Edit Text Content
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Original Text</label>
                    <div id="modal-original-text" class="p-2.5 bg-slate-100 rounded-lg text-sm text-slate-600 italic break-words border border-slate-200"></div>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">New Text</label>
                    <input type="text" id="modal-input" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div class="bg-slate-50 p-4 border-t border-slate-100 flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-200 transition-all">Cancel</button>
                <button id="modal-save-btn" class="px-4 py-2 rounded-lg text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white transition-all">Apply Change</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const fileInput = document.getElementById('pdf-file');
        const canvas = document.getElementById('pdf-canvas');
        const textLayerDiv = document.getElementById('text-layer');
        const ctx = canvas.getContext('2d');
        const modal = document.getElementById('edit-modal');
        const modalInput = document.getElementById('modal-input');
        const modalOriginalText = document.getElementById('modal-original-text');
        
        let currentTargetSpan = null;
        let historyCounter = 0;

        fileInput.addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const page = await pdf.getPage(1);

            const viewport = page.getViewport({ scale: 2.0 }); // High-Res Scale for sharp output

            canvas.height = viewport.height;
            canvas.width = viewport.width;

            textLayerDiv.style.height = viewport.height + 'px';
            textLayerDiv.style.width = viewport.width + 'px';
            textLayerDiv.innerHTML = '';

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            const textContent = await page.getTextContent();
            
            await pdfjsLib.renderTextLayer({
                textContent: textContent,
                container: textLayerDiv,
                viewport: viewport,
                textDivs: []
            }).promise;

            setupTextSpanEvents();
        });

        function setupTextSpanEvents() {
            const spans = textLayerDiv.querySelectorAll('span');
            spans.forEach(span => {
                span.addEventListener('click', function() {
                    currentTargetSpan = this;
                    modalOriginalText.innerText = this.innerText;
                    modalInput.value = this.innerText;
                    modal.classList.remove('hidden');
                    modalInput.focus();
                });
            });
        }

        document.getElementById('modal-save-btn').addEventListener('click', function() {
            if (!currentTargetSpan) return;

            const oldText = modalOriginalText.innerText;
            const newText = modalInput.value;

            if (newText.trim() !== "") {
                const rect = currentTargetSpan.getBoundingClientRect();
                const containerRect = textLayerDiv.getBoundingClientRect();
                
                const x = (rect.left - containerRect.left);
                const y = (rect.top - containerRect.top);
                const width = rect.width;
                const height = rect.height;

                // 1. Original Text එක තිබූ තැන සුදු පැහැයෙන් Erase කිරීම
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x - 2, y - 2, width + 4, height + 4);

                // 2. Original Font Size එක ඒ අයුරින්ම ලබා ගැනීම
                const computedStyle = window.getComputedStyle(currentTargetSpan);
                const originalFontSize = computedStyle.fontSize;

                // 3. New Text එක Spans එකට එකතු කිරීම
                currentTargetSpan.innerText = newText;
                currentTargetSpan.classList.add('edited-span');
                
                currentTargetSpan.style.fontSize = originalFontSize;
                currentTargetSpan.style.lineHeight = computedStyle.lineHeight;
                currentTargetSpan.style.fontFamily = computedStyle.fontFamily;

                addToHistory(oldText, newText);
            }

            closeModal();
        });

        function closeModal() {
            modal.classList.add('hidden');
            currentTargetSpan = null;
        }

        function addToHistory(oldText, newText) {
            const historyList = document.getElementById('history-list');
            const emptyState = document.getElementById('empty-state');
            
            if (emptyState) emptyState.remove();

            historyCounter++;
            document.getElementById('history-count').innerText = historyCounter;

            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const historyItem = document.createElement('div');
            historyItem.className = 'bg-slate-50 border border-slate-200 p-3 rounded-lg text-xs space-y-1 shadow-2xs';
            historyItem.innerHTML = `
                <div class="flex justify-between items-center text-slate-400 font-medium">
                    <span>#${historyCounter} Text Edit</span>
                    <span>${timeString}</span>
                </div>
                <div class="line-through text-rose-500 truncate">${oldText}</div>
                <div class="text-emerald-600 font-semibold truncate">${newText}</div>
            `;

            historyList.prepend(historyItem);
        }

        // Direct Render and Export to PDF (No cutting or alignment issues)
        async function downloadPDF() {
            if (!canvas.width) {
                alert("කරුණාකර පළමුව PDF එකක් Upload කරන්න!");
                return;
            }

            // Create Off-screen Working Canvas
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvas.width;
            exportCanvas.height = canvas.height;
            const exportCtx = exportCanvas.getContext('2d');

            // 1. Draw Base PDF Canvas
            exportCtx.drawImage(canvas, 0, 0);

            // 2. Draw Edited Text Layers directly onto the Canvas Context
            const spans = textLayerDiv.querySelectorAll('.edited-span');
            spans.forEach(span => {
                const rect = span.getBoundingClientRect();
                const containerRect = textLayerDiv.getBoundingClientRect();
                
                const x = rect.left - containerRect.left;
                const y = rect.top - containerRect.top;

                const computedStyle = window.getComputedStyle(span);
                const fontSize = computedStyle.fontSize;
                const fontFamily = computedStyle.fontFamily;

                // Draw Text
                exportCtx.font = `${fontSize} ${fontFamily}`;
                exportCtx.fillStyle = '#000000';
                exportCtx.textBaseline = 'top';
                exportCtx.fillText(span.innerText, x, y);
            });

            // 3. Export to jsPDF with selected paper size
            const { jsPDF } = window.jspdf;
            const selectedPaperSize = document.getElementById('paper-size').value;
            
            const pdf = new jsPDF({
                orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
                unit: 'px',
                format: selectedPaperSize
            });

            const pdfWidth = pdf.internal.pageSize.getWidth();
            const pdfHeight = pdf.internal.pageSize.getHeight();

            const imgData = exportCanvas.toDataURL('image/jpeg', 1.0);
            
            // Auto Scale & Fit to PDF Page
            pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
            pdf.save('edited_document.pdf');
        }
    </script>
</body>
</html>
